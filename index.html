<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gorepad</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0a0a0a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }
      p {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-optical-sizing: auto;
        color: white;
        font-size: clamp(14px, 2vw, 18px);
        font-weight: 500;
        margin-top: 20px;
      }
      img {
        width: 100%;
        max-width: 484px;
        height: auto;
        pointer-events: none;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Jersey+10&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Secular+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <img src="logo.png" alt="Gorepad Logo" />
    <p>Something sinister is lurking in the shadows...</p>
  </body>
</html>
